<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Surprise 💖</title>

<style>
body{
    margin:0;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,.2);
    z-index:2;
}

h1{
    color:#ff4081;
}

button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:30px;
    background:#ff4081;
    color:white;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.1);
}

.heart{
    position:absolute;
    color:#ff3366;
    font-size:24px;
    animation:float 6s linear infinite;
}

@keyframes float{
    from{
        transform:translateY(100vh);
        opacity:1;
    }
    to{
        transform:translateY(-100px);
        opacity:0;
    }
}
</style>
</head>

<body>

<div class="card">
<h1>🌸 Hi! 🌸</h1>
<p>You make the world a little brighter. 💖</p>

<button onclick="reply()">Will you be my friend? 😊</button>

<p id="msg"></p>
</div>

<script>
function reply(){
document.getElementById("msg").innerHTML="Yay! 🎉 Thank you for being my friend ❤️";
}

function createHeart(){
const heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"vw";
heart.style.fontSize=(20+Math.random()*30)+"px";
heart.style.animationDuration=(3+Math.random()*3)+"s";
document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},6000);
}

setInterval(createHeart,300);
</script>

</body>
</html>
