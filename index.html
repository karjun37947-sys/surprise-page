
    <!DOCTYPE html>
<html>
<head>
<title>Chudail Surprise 👻</title>

<style>
body{
    height:100vh;
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#2b0033,#000);
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.box{
    text-align:center;
    background:rgba(255,255,255,0.1);
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 25px purple;
}

h1{
    color:#ff4dff;
    text-shadow:0 0 15px red;
}

#timer{
    font-size:60px;
    color:#ff0000;
}

button{
    padding:12px 30px;
    margin:10px;
    border:none;
    border-radius:15px;
    font-size:18px;
    cursor:pointer;
}

#yes{
    background:green;
    color:white;
}

#no{
    background:red;
    color:white;
    position:absolute;
}

.ghost{
    font-size:60px;
    animation:float 2s infinite;
}

@keyframes float{
    50%{
        transform:translateY(-20px);
    }
}
</style>

</head>

<body>

<div class="box">

<div class="ghost">👻</div>

<h1 id="question">Chudail is coming...</h1>

<div id="timer">4</div>

<div id="buttons" style="display:none;">
<button id="yes">Yes 😈</button>
<button id="no">No 😅</button>
</div>

</div>


<script>

let count=4;

let countdown=setInterval(()=>{

count--;

document.getElementById("timer").innerHTML=count;

if(count<=0){

clearInterval(countdown);

document.getElementById("timer").style.display="none";

showQuestion();

}

},1000);


let questions=[
"Are you a Chudail? 👻",
"Are you a Bhootni? 🧟‍♀️",
"Did you like this surprise? ❤️"
];


let index=0;


function showQuestion(){

document.getElementById("question").innerHTML=
questions[index];

document.getElementById("buttons").style.display="block";

}


yes.onclick=function(){

index++;

if(index < questions.length){

showQuestion();

}else{

document.getElementById("question").innerHTML=
"Thank you 😄👻";

document.getElementById("buttons").style.display="none";

}

};


no.onmouseover=function(){

let x=Math.random()*(window.innerWidth-100);
let y=Math.random()*(window.innerHeight-50);

no.style.left=x+"px";
no.style.top=y+"px";

};

</script>

</body>
</html>
