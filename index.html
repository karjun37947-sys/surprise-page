<!DOCTYPE html>
<html>
<head>
<title>Chudail Surprise 👻</title>

<style>
body{
height:100vh;
margin:0;
display:flex;
justify-content:center;
align-items:center;
background:#120018;
font-family:Arial;
color:white;
overflow:hidden;
}

.box{
text-align:center;
background:#250033;
padding:35px;
border-radius:20px;
box-shadow:0 0 30px purple;
}

#count{
font-size:60px;
color:red;
}

button{
padding:12px 30px;
margin:10px;
font-size:18px;
border:none;
border-radius:12px;
cursor:pointer;
}

#yes{
background:green;
color:white;
}

#no{
background:red;
color:white;
position:absolute;
transition:0.2s;
}

#final{
font-size:25px;
color:#ff99ff;
}

</style>
</head>

<body>

<div class="box">

<h1 id="question">👻 Loading...</h1>

<div id="count">3</div>

<div id="buttons" style="display:none;">
<button id="yes">Yes ❤️</button>
<button id="no">No 😅</button>
</div>

<div id="final"></div>

</div>


<script>

let questions=[
"Are you a Chudail? 👻",
"Are you a Baunii? 😈",
"How did you like my surprise? ❤️"
];

let index=0;


function countdown(){

let t=3;

count.style.display="block";
buttons.style.display="none";


let timer=setInterval(()=>{

count.innerHTML=t;
t--;

if(t<0){

clearInterval(timer);
showQuestion();

}

},1000);

}



function showQuestion(){

count.style.display="none";

question.innerHTML=questions[index];

buttons.style.display="block";

}



yes.onclick=function(){

index++;

if(index < questions.length){

countdown();

}else{

question.innerHTML="🎉 Surprise Completed 👻";

final.innerHTML="❤️ Thank you!";

buttons.style.display="none";

}

};



// No button keeps moving

function moveNo(){

let x=Math.random()*(window.innerWidth-120);
let y=Math.random()*(window.innerHeight-80);

no.style.left=x+"px";
no.style.top=y+"px";

}


no.addEventListener("mouseover",moveNo);

no.addEventListener("click",moveNo);

no.addEventListener("touchstart",moveNo);


countdown();

</script>

</body>
</html>
